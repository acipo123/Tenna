<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tenna Display Controller</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #viewport-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center center;
      transition: transform 0.2s ease;
      background-color: #ffffff;
    }

    #main-display {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #ffffff;
    }

    #main-image, #main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    #main-video {
      display: none;
    }

    .blank-white-screen {
      display: none;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }

    .blank-black-screen {
      display: none;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    /* HUD Ultra Compacto y pegado a la extrema derecha */
    #hud {
      position: absolute;
      top: 50%;
      right: max(4px, env(safe-area-inset-right));
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 4px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
      width: 54px;
      transition: opacity 0.3s ease;
    }

    #hud.hidden-hud {
      opacity: 0;
      pointer-events: none;
    }

    #hud-preview-container {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #hud-preview {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    #hud-title {
      font-size: 6.5px;
      font-weight: bold;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      margin: 0;
      text-align: center;
      word-break: break-word;
      line-height: 1;
    }

    #hud-controls {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      align-items: center;
    }

    .btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 4px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn:active {
      background: #555;
    }

    #fullscreen-btn {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      z-index: 10;
    }

    #settings-btn {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }

    #settings-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content label {
      font-size: 13px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-content input, .modal-content select {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div id="main-display">
      <img id="main-image" src="117172_2.png" alt="Tenna Display">
      <video id="main-video" src="tvtime.mp4" playsinline webkit-playsinline></video>
      <div id="blank-white" class="blank-white-screen"></div>
      <div id="blank-black" class="blank-black-screen"></div>
    </div>
  </div>

  <div id="fullscreen-btn" onclick="toggleFullScreen()">⛶</div>

  <div id="hud">
    <div id="hud-title">Tenna Normal</div>
    <div id="hud-preview-container">
      <img id="hud-preview" src="117172_2.png" alt="Preview">
    </div>
    <div id="hud-controls">
      <button class="btn" onclick="prevExpression()">◄</button>
      <button class="btn" onclick="applyExpression()">OK</button>
      <button class="btn" onclick="nextExpression()">►</button>
      <button class="btn" onclick="toggleTalking()">▲</button>
    </div>
  </div>

  <div id="settings-btn" onclick="toggleSettings()">⚙</div>

  <div id="settings-modal">
    <div class="modal-content">
      <h3>Configuración de Pantalla</h3>
      <label>
        Zoom / Escala de Pantalla:
        <select id="scale-select" onchange="updateDisplayScale(this.value)">
          <option value="1">100% (Normal)</option>
          <option value="1.4">140% Zoom</option>
          <option value="1.8">180% Zoom</option>
          <option value="2.1" selected>210% Zoom</option>
          <option value="2.5">250% Zoom Máximo</option>
        </select>
      </label>
      <label>
        Ajuste de Imagen:
        <select id="fit-select" onchange="updateObjectFit(this.value)">
          <option value="contain" selected>Ajustar (Contain - Franjas blancas)</option>
          <option value="cover">Llenar pantalla (Cover)</option>
        </select>
      </label>
      <label>
        Panel HUD en Pantalla:
        <select id="hud-visibility-select" onchange="toggleHudVisibility(this.value)">
          <option value="show" selected>Visible</option>
          <option value="hide">Ocultar (Para Cosplay)</option>
        </select>
      </label>
      <label>
        Velocidad Animación (ms):
        <input type="number" id="speed-input" value="180" step="20">
      </label>
      <label>
        Archivo Audio Habla:
        <input type="text" id="audio-input" value="tenna-talking.mp3">
      </label>
      <button class="btn" onclick="saveSettings()">Guardar y Cerrar</button>
    </div>
  </div>

  <audio id="talk-audio" src="tenna-talking.mp3" loop preload="auto"></audio>

  <script>
    const BLANK_TRANSPARENT = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    const expressions = [
      {
        name: "Tenna Normal",
        static: "117172_2.png",
        talking: ["109019_2.png", "124038.png", "109018_2.png", "124039.png"]
      },
      {
        name: "TV Time",
        static: "118699.gif",
        isVideo: true,
        videoSrc: "tvtime.mp4",
        talking: []
      },
      {
        name: "Tenna Contento",
        static: "124076.png",
        talking: []
      },
      {
        name: "Molesto",
        static: "117691.png",
        talking: ["109023.png", "117705.png"]
      },
      {
        name: "Serio",
        static: "117742.png",
        talking: ["117746.png", "117747.png", "117748.png", "117749.png", "117750.png", "117751.png"]
      },
      {
        name: "Sonrojado",
        static: "118616.png",
        talking: ["118617.png", "118618.png", "118619.png", "118620.png"]
      },
      {
        name: "Tenna Estresado",
        static: "120002.png",
        talking: []
      },
      {
        name: "En blanco (dibujo)",
        static: "118693.png",
        talking: []
      },
      {
        name: "Pantalla en blanco",
        static: BLANK_TRANSPARENT,
        talking: [],
        isBlankWhite: true
      },
      {
        name: "En negro",
        static: BLANK_TRANSPARENT,
        talking: [],
        isBlankBlack: true
      },
      {
        name: "Estática",
        static: "118699.gif",
        talking: [],
        isFullSize: true
      },
      {
        name: "Barras de Color",
        static: "118717.jpg",
        talking: [],
        isFullSize: true
      }
    ];

    let currentActiveIndex = 0;
    let hudSelectedIndex = 0;
    let isTalking = false;
    let frameIndex = 0;
    let animInterval = null;
    let frameSpeed = 180;
    let currentScale = 2.1;
    let currentFitMode = "contain";

    const viewportContainer = document.getElementById("viewport-container");
    const mainImg = document.getElementById("main-image");
    const mainVideo = document.getElementById("main-video");
    const blankWhite = document.getElementById("blank-white");
    const blankBlack = document.getElementById("blank-black");
    const hudEl = document.getElementById("hud");
    const hudPreview = document.getElementById("hud-preview");
    const hudTitle = document.getElementById("hud-title");
    const audioEl = document.getElementById("talk-audio");

    viewportContainer.style.transform = `scale(${currentScale})`;

    function updateHud() {
      const exp = expressions[hudSelectedIndex];
      hudPreview.src = exp.static;
      hudTitle.textContent = exp.name;
    }

    function prevExpression() {
      hudSelectedIndex = (hudSelectedIndex - 1 + expressions.length) % expressions.length;
      updateHud();
    }

    function nextExpression() {
      hudSelectedIndex = (hudSelectedIndex + 1) % expressions.length;
      updateHud();
    }

    function updateImageDisplay() {
      const exp = expressions[currentActiveIndex];

      mainImg.style.display = "none";
      mainVideo.style.display = "none";
      blankWhite.style.display = "none";
      blankBlack.style.display = "none";
      mainVideo.pause();

      if (exp.isVideo) {
        mainVideo.style.display = "block";
        mainVideo.style.objectFit = currentFitMode;
        mainVideo.currentTime = 0;
        mainVideo.play().catch(err => console.log("Error de video:", err));
      } else if (exp.isBlankWhite) {
        blankWhite.style.display = "block";
      } else if (exp.isBlankBlack) {
        blankBlack.style.display = "block";
      } else {
        mainImg.style.display = "block";
        if (exp.isFullSize) {
          mainImg.style.objectFit = "cover";
        } else {
          mainImg.style.objectFit = currentFitMode;
        }
      }
    }

    function applyExpression() {
      currentActiveIndex = hudSelectedIndex;
      updateImageDisplay();
      
      if (isTalking) {
        stopTalking();
      } else if (!expressions[currentActiveIndex].isBlankWhite && 
                 !expressions[currentActiveIndex].isBlankBlack && 
                 !expressions[currentActiveIndex].isVideo) {
        mainImg.src = expressions[currentActiveIndex].static;
      }
    }

    function toggleTalking() {
      if (isTalking) {
        stopTalking();
      } else {
        startTalking();
      }
    }

    function startTalking() {
      const exp = expressions[currentActiveIndex];
      const frames = exp.talking;
      
      if (!frames || frames.length === 0 || exp.isBlankWhite || exp.isBlankBlack || exp.isVideo) {
        return;
      }

      isTalking = true;
      frameIndex = 0;
      mainImg.src = frames[0];

      audioEl.play().catch(err => console.log("Audio a la espera:", err));

      clearInterval(animInterval);
      animInterval = setInterval(() => {
        frameIndex = (frameIndex + 1) % frames.length;
        mainImg.src = frames[frameIndex];
      }, frameSpeed);
    }

    function stopTalking() {
      isTalking = false;
      clearInterval(animInterval);
      
      audioEl.pause();
      audioEl.currentTime = 0;

      const exp = expressions[currentActiveIndex];
      if (!exp.isBlankWhite && !exp.isBlankBlack && !exp.isVideo) {
        mainImg.src = exp.static;
      }
    }

    function updateDisplayScale(scaleVal) {
      currentScale = parseFloat(scaleVal);
      viewportContainer.style.transform = `scale(${currentScale})`;
    }

    function updateObjectFit(fitVal) {
      currentFitMode = fitVal;
      updateImageDisplay();
    }

    function toggleHudVisibility(val) {
      if (val === "hide") {
        hudEl.classList.add("hidden-hud");
      } else {
        hudEl.classList.remove("hidden-hud");
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function toggleSettings() {
      const modal = document.getElementById("settings-modal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function saveSettings() {
      const speedVal = parseInt(document.getElementById("speed-input").value);
      if (!isNaN(speedVal) && speedVal > 50) {
        frameSpeed = speedVal;
      }
      const audioVal = document.getElementById("audio-input").value.trim();
      if (audioVal) {
        audioEl.src = audioVal;
      }
      toggleSettings();
    }

    window.addEventListener("keydown", (e) => {
      switch(e.key) {
        case "ArrowLeft":
          prevExpression();
          break;
        case "ArrowRight":
          nextExpression();
          break;
        case "Enter":
        case " ":
          applyExpression();
          break;
        case "ArrowUp":
          toggleTalking();
          break;
      }
    });

    document.addEventListener("click", () => {
      if (audioEl.paused && isTalking) {
        audioEl.play().catch(() => {});
      }
    }, { once: true });

    updateHud();
  </script>
</body>
</html>
